
<!DOCTYPE html>
<html>
<head>
<title>Emergency Water Damage Repair</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<h1>Emergency Water Damage Repair Near You</h1>
<p>Get immediate help from certified professionals.</p>
<form method="POST" action="/api/lead">
<input name="full_name" placeholder="Full Name" required>
<input name="phone_number" placeholder="Phone Number" required>
<input name="email" placeholder="Email">
<input name="city" placeholder="City" required>
<select name="service_needed">
<option>Flood Cleanup</option>
<option>Burst Pipe</option>
<option>Mold Removal</option>
</select>
<select name="urgency_level">
<option>Immediate</option>
<option>Within 24 Hours</option>
<option>Within 3 Days</option>
</select>
<button type="submit">Request Help</button>
</form>
</body>
</html>
